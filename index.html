<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MDT-I Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--surf:#fff;--ink:#101a2c;--mut:#5b6b85;--line:#e1e7f0;--navy:#1d3a63;--nink:#fff;--chip:#fff0b3;--chipink:#3a2d00;--red:#d4272b;--mic:#168a4a;--par:#d97316;--ter:#7a4cc2;--ok:#1d3a63;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-theme="dark"]{--bg:#0b1322;--surf:#142036;--ink:#eaf0fb;--mut:#9db0cf;--line:#26375a;--navy:#2a4d82;--chip:#4a3d10;--chipink:#f6e7a8;--red:#ff7a7a;--mic:#52d38a;--par:#f4a661;--ter:#bb9cf2;--ok:#8fb4f0;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.55;min-height:100vh}
h1,h2,b,.dn{font-family:'Cairo','Segoe UI',Tahoma,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:14px 14px 40px}
button,a{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar h1{font-size:24px;font-weight:800;margin:0}
.bar small{display:block;color:var(--mut);font-size:13px;font-weight:500}
.tools{display:flex;gap:8px}
.ib{height:38px;min-width:38px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-weight:700;display:grid;place-content:center}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{margin-top:14px;background:var(--navy);color:var(--nink);border-radius:20px;padding:16px}
.hero .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.hero button{background:#fde68a;color:#3a2d00;border:0;border-radius:99px;padding:3px 12px;font-weight:700;font-size:13px}
.pbar{height:10px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:12px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:#fde68a;border-radius:99px;transition:width .25s}
.cnt{margin-top:6px;font-size:14px;font-weight:700}
.pick{margin-top:14px;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:18px}
.pick h2{font-size:18px;margin:0 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g8{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pick button{background:transparent;color:var(--ink);border:2px solid var(--navy);border-radius:14px;padding:14px 0;font:800 20px 'Cairo',sans-serif}
.pick button:hover{background:var(--navy);color:var(--nink)}
.sec{margin:22px 2px 8px;font:800 17px 'Cairo',sans-serif}
.ev{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:8px}
.ev.ex{border-color:var(--red)}
.ev.pastd{opacity:.5}
.tile{flex:none;width:56px;text-align:center;background:var(--navy);color:var(--nink);border-radius:12px;padding:5px 0}
.ev.ex .tile{background:var(--red);color:#fff}
.tile b{display:block;font-size:22px;line-height:1.1}.tile span{font-size:12px}
.ev .tx{flex:1;min-width:0}.ev .tx b{display:block;font-size:16px}.ev .tx span{color:var(--mut);font-size:13px;display:block}
.pill{flex:none;background:var(--chip);color:var(--chipink);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.chips{display:flex;gap:8px;margin-top:18px}
.chips button{flex:1;padding:9px;border-radius:12px;border:2px solid var(--navy);background:transparent;color:var(--ink);font-weight:700}
.chips button[aria-pressed=true]{background:var(--navy);color:var(--nink)}
.dh{display:flex;align-items:center;gap:10px;margin-top:20px}
.dn{background:var(--navy);color:var(--nink);border-radius:12px;min-width:46px;text-align:center;padding:2px 6px;font-size:20px;font-weight:800;line-height:1.2}
.dn small{display:block;font-size:11px;font-weight:600}
.dh b{font-size:16px}.dh i{font-style:normal;background:var(--chip);color:var(--chipink);border-radius:99px;padding:0 10px;font-size:12px;font-weight:700}
.card{display:flex;gap:12px;padding:12px;background:var(--surf);border:1px solid var(--line);border-radius:16px;margin-top:10px;border-inline-start:6px solid var(--c)}
.card.m{--c:var(--mic)}.card.p{--c:var(--par)}.card.t{--c:var(--ter)}
.tm{flex:none;width:56px;text-align:center;background:var(--chip);color:var(--chipink);border-radius:12px;padding:6px 0;align-self:flex-start;font-family:'Cairo',sans-serif}
.tm b{display:block;font-size:17px;line-height:1.2}.tm span{font-size:12px;opacity:.85}
.bd{flex:1;min-width:0}
.top{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700}
.tag{color:var(--c)}.code{color:var(--mut)}
.ttl{font-weight:700;direction:ltr;text-align:left;unicode-bidi:plaintext;margin-top:2px}
.cp{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cp span{background:var(--chip);color:var(--chipink);border-radius:8px;padding:0 8px;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.acts a,.acts button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:3px 12px;font-size:13px;font-weight:700;text-decoration:none}
.acts .off{opacity:.6}
.msg{color:var(--red);font-weight:700;font-size:13px;margin-top:6px}
.card input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin-top:2px;border:2px solid var(--mut);border-radius:8px;background:transparent;display:grid;place-content:center;cursor:pointer}
.card input:checked{background:var(--ok);border-color:var(--ok)}
.card input:checked::after{content:"";width:6px;height:12px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translateY(-1px)}
.card.done .bd,.card.done .tm{opacity:.5}
.foot{margin-top:30px;padding:18px 16px;border:1px solid var(--line);background:var(--surf);border-radius:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.fx{font-size:14px;color:var(--mut)}.fx b{color:var(--ink)}
.fy{font-size:15px;font-weight:700}
.wab{display:flex;align-items:center;gap:10px;border:2px solid #25D366;color:var(--ink);border-radius:99px;padding:5px 16px 5px 6px;font-weight:700;text-decoration:none;margin-top:4px}
.wab svg{width:30px;height:30px}
.bn{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-weight:700;font-size:14px;background:#fde68a;color:#3a2d00}
.bn.x{background:var(--red);color:#fff}
.bn span{flex:1}
.bn button{border:0;background:rgba(0,0,0,.18);color:inherit;width:28px;height:28px;border-radius:50%;font-size:16px;line-height:1;flex:none}
[hidden]{display:none!important}
</style>
</head>

function tm(s){const f=x=>{let[h,m]=x.split(":");h=+h;m=+(m||0);if(h<8)h+=12;return h*60+m};const[a,b]=s.split("-");return[f(a),f(b)]}
